# 静态站点缓存片段。一键发布会把它 include 进大陆站的 server 块。
# 同类网页发布沿用同一份：入口短缓存，带内容哈希的 /assets/ 长缓存。
# 不要改成整站一个很长的 max-age。没有哈希的图标和 HTML 不走 /assets/ 这条。
# expires -1 的响应头是 Cache-Control: no-cache，普通刷新或重新打开都会向源站确认入口文档。

location = /index.html {
    expires -1;
}

location = / {
    expires -1;
    try_files /index.html =404;
}

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
