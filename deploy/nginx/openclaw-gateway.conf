# OpenClaw 网关的站点片段示例。
# 分析师验收通过之后，再把本片段放进大陆站 124.221.56.38 的 server 块。
# 本片段不替换现有的 location /api/。现有网页数据接口仍然反代到 127.0.0.1:8787。
# proxy_pass 末尾的斜杠会去掉对外的 /openclaw 前缀，网关进程看到的路径是 /v1/...。
# 不在白名单中的来源地址由 Nginx 直接拒绝，请求不会进入网关进程。
# 安全组继续只开放 80、443 以及运维所需的 22。不要把 8787 或 8790 暴露到公网。

location /openclaw/ {
    allow 101.132.38.171;
    deny all;

    proxy_pass http://127.0.0.1:8790/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
}
